<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moral dilemmas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="home">
<header class="site-header" aria-label="Site controls">
  <button id="btn-auth" class="utility-button" type="button">Sign in</button>
  <button id="theme-toggle" class="utility-button" type="button">Dark</button>
</header>

<main>
  <h1>moral dilemmas</h1>
  <p id="global-error" class="error" hidden></p>

  <!-- home -->
  <section id="view-home" class="view">
    <button id="btn-singleplayer" type="button">Singleplayer</button>
    <button id="btn-rooms" type="button">Play</button>
  </section>

  <!-- auth -->
  <section id="view-auth" class="view" hidden>
    <div id="auth-signed-out">
      <form id="auth-form">
        <input id="auth-name" type="text" placeholder="Name" autocomplete="nickname">
        <input id="auth-email" type="email" placeholder="Email" autocomplete="email" required>
        <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button id="btn-signin" type="submit">Sign in</button>
        <button id="btn-signup" type="button">Sign up</button>
      </form>
      <form id="auth-link-form">
        <input id="auth-link-email" type="email" placeholder="Email for sign-in link" autocomplete="email" required>
        <button id="btn-email-link" type="submit">Email me a sign-in link</button>
        <button id="btn-email-complete" type="button" hidden>Complete sign-in link</button>
      </form>
      <p id="auth-link-status" class="muted" hidden></p>
    </div>
    <div id="auth-signed-in" hidden>
      <p id="auth-who"></p>
      <button id="btn-signout" type="button">Sign out</button>
    </div>
    <p id="auth-error" class="error" hidden></p>
    <button class="back" type="button" data-back>Back</button>
  </section>

  <!-- create / join -->
  <section id="view-rooms" class="view" hidden>
    <label for="create-mode">Game type</label>
    <select id="create-mode">
      <option value="free-response">Free response</option>
      <option value="multiple-choice">Multiple-choice</option>
    </select>
    <label for="create-anonymous">Response identity</label>
    <select id="create-anonymous">
      <option value="on">Anonymous on</option>
      <option value="off">Anonymous off</option>
    </select>
    <button id="btn-create-room" type="button">Create a room</button>
    <form id="join-form">
      <input id="join-code" type="text" placeholder="Room code" maxlength="4" autocomplete="off">
      <button type="submit">Join a room</button>
    </form>
    <p id="rooms-error" class="error" hidden></p>
    <button class="back" type="button" data-back>Back</button>
  </section>

  <!-- singleplayer setup -->
  <section id="view-single-setup" class="view" hidden>
    <p>Choose a game type.</p>
    <button id="btn-single-free" type="button">Free response</button>
    <button id="btn-single-choice" type="button">Multiple-choice</button>
    <button class="back" type="button" data-back>Back</button>
  </section>

  <!-- room / game -->
  <section id="view-room" class="view" hidden>
    <p id="room-header"></p>
    <div id="room-body"></div>
    <p id="room-error" class="error" hidden></p>
    <button id="btn-leave" type="button">Leave room</button>
  </section>

  <!-- singleplayer -->
  <section id="view-single" class="view" hidden>
    <p id="single-dilemma"></p>
    <p id="single-source"></p>
    <form id="single-form">
      <div id="single-options"></div>
      <textarea id="single-response" rows="5" required></textarea>
      <button type="submit">Next dilemma</button>
    </form>
    <button class="back" type="button" data-back>Back</button>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
